name: open-artisan
version: 0.1.0
description: Phased workflow enforcement for Hermes agents
entry_point: hermes_adapter
author: Open Artisan

tools:
  - oa_check_prior_workflow
  - oa_select_mode
  - oa_mark_scan_complete
  - oa_mark_analyze_complete
  - oa_request_review
  - oa_submit_feedback
  - oa_scheduling_complete
  - oa_phase_skipped
  - oa_mark_task_complete
  - oa_reset_task
  - oa_resolve_human_gate
  - oa_propose_backtrack
  - oa_propose_direct_application
  - oa_query_parent_workflow
  - oa_query_child_workflow
  - oa_analyze_task_boundary_change
  - oa_apply_task_boundary_change
  - oa_approve_current_task_scope_expansion
  - oa_repair_current_task_boundary_from_impl_plan
  - oa_route_patch_suggestions
  - oa_resolve_patch_suggestion
  - oa_apply_patch_suggestion
  - oa_request_allowlist_expansion
  - oa_summarize_workflow_incident
  - oa_report_drift
  - oa_plan_drift_repair
  - oa_apply_drift_repair
  - oa_product_management_assess_request
  - oa_product_management_list_work
  - oa_product_management_queue_item
  - oa_roadmap_read
  - oa_roadmap_query
  - oa_roadmap_derive_execution_slice
  - oa_roadmap_upsert_item
  - oa_roadmap_update_item_status
  - oa_roadmap_delete_item
  - oa_roadmap_upsert_edge
  - oa_roadmap_delete_edge
  - oa_roadmap_replace
  - oa_roadmap_delete
  - oa_state
  - oa_list_projects
  - oa_select_project
  - oa_recover_bridge

hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call

dependencies:
  runtime:
    - python >= 3.10
    - bun  # for bridge server subprocess
  python: []  # stdlib only
